services:
  db:
    image: postgres:15-alpine
    container_name: jenseiroku-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jenseiroku-network

  minio:
    image: minio/minio:latest
    container_name: jenseiroku-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - jenseiroku-network

  backend:
    build: ./backend
    container_name: jenseiroku-backend
    ports:
      - "${BACKEND_PORT}"
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - jenseiroku-network

  frontend:
    build: ./frontend
    container_name: jenseiroku-frontend
    ports:
      - "${FRONTEND_PORT}:4200"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - jenseiroku-network

networks:
  jenseiroku-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data: