services:
  db:
    image: postgres:15-alpine
    container_name: jenseiroku-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Kathmandu
      PGTZ: Asia/Kathmandu
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - jenseiroku-network

  minio:
    image: minio/minio:latest
    container_name: jenseiroku-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Kathmandu
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - jenseiroku-network

  backend:
    image: ghcr.io/cruvss/jenseiroku-backend:latest
    container_name: jenseiroku-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:9090"
    depends_on:
      - db
      - minio
    env_file:
      - ./.env
    environment:
      TZ: Asia/Kathmandu
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - jenseiroku-network

  frontend:
    image: ghcr.io/cruvss/jenseiroku-frontend:latest
    container_name: jenseiroku-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    environment:
      TZ: Asia/Kathmandu
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - jenseiroku-network

networks:
  jenseiroku-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data: