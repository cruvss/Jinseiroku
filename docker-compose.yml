services:
  db:
    image: postgres:15-alpine
    container_name: jenseiroku-db
    environment:
      POSTGRES_USER: sachin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: life
      TZ: Asia/Kathmandu
      PGTZ: Asia/Kathmandu 
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - jenseiroku-network

  minio:
    image: minio/minio:latest
    container_name: jenseiroku-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
      TZ: Asia/Kathmandu
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - jenseiroku-network

  backend:
    image: ghcr.io/cruvss/jenseiroku-backend:latest
    container_name: jenseiroku-backend
    restart: unless-stopped
    ports:
      - "9090:9090"
    depends_on:
      - db
    env_file:
      - ./.env
    environment:
      TZ: Asia/Kathmandu
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - jenseiroku-network

  frontend:
    image: ghcr.io/cruvss/jenseiroku-frontend:latest
    container_name: jenseiroku-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    environment:
      TZ: Asia/Kathmandu
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - jenseiroku-network

networks:
  jenseiroku-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
